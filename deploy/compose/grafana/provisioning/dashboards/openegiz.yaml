apiVersion: 1
providers:
  - name: openegiz
    folder: OpenEgiz
    type: file
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true
  # Filled by example overlays (examples/*/compose.yml); empty otherwise.
  - name: examples
    folder: OpenEgiz Examples
    type: file
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/example-dashboards
  # The Team's mine (team/vent/compose.yml mounts it); empty otherwise.
  - name: team
    folder: Шахта Арқа-1
    type: file
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/team-dashboards
